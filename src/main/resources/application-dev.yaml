server:
  port: 8080

logging:
  level:
    root: INFO
    com.tenco.spring_blog: DEBUG

spring:
  # 데이터베이스 연결 (H2 메모리 DB 사용)
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:blogdb
    username: sa
    password:

  # h2 콘솔 화면 켜기 (http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true

  # JPA 설정
  jpa:
    hibernate:
      # 시작할 때 마다 테이블을 새로 만든다. 기존 데이터는 사라진다. (개발용)
      ddl-auto: create
    # 실행되는 SQL을 콘솔에 출력한다.
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 10
        format_sql: true    # 출력되는 SQL을 콘솔창에 줄바꿈해 보기좋게 표시
    # data.sql을 테이블 생성 후에 실행한다.
    defer-datasource-initialization: true

  # 서버 시작 시 이 파일 실행
  sql:
    init:
      data-locations:
        - classpath:db/data.sql