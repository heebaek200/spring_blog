spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: spring_blog
  profiles:
    active: local
  mustache:
    servlet:
      expose-session-attributes: false   # Mustache 파일에서 세션값 미사용
  jpa:
    open-in-view: false # OSIV 비적용. 트랜잭션이 끝나면 영속성 컨텍스트 지연 로딩 불가.
    properties:
      hibernate:
        default_batch_fetch_size: 10

server:
  servlet:
    session:
      tracking-modes: cookie    # 세션 번호를 쿠키로만 전달 (주소에 ;jsessionid 를 붙이지 않음)