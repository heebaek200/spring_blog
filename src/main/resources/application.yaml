spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: spring_blog
  profiles:
    active: local
  mustache:
    servlet:
      expose-session-attributes: false   # Mustache 파일에서 세션값 미사용
  servlet:
    multipart:
      max-file-size: 10MB      # 파일 하나의 최대 크기
      max-request-size: 11MB   # 요청 전체(파일 + 입력값)의 최대 크기
  jpa:
    open-in-view: false # OSIV 비적용. 트랜잭션이 끝나면 영속성 컨텍스트 지연 로딩 불가.
    properties:
      hibernate:
        default_batch_fetch_size: 10

server:
  servlet:
    session:
      tracking-modes: cookie    # 세션 번호를 쿠키로만 전달 (주소에 ;jsessionid 를 붙이지 않음)

# 초기 파라미터 설정
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRECT}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}
agent:
  gemini:
    api-key: ${GEMINI_API_KEY}